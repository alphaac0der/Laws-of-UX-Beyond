name: Something is broken
description: A demo, page or link doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or the law's name.
      placeholder: https://…/laws/hicks-law
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome 131
